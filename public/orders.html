<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Orders — Sasta Bazaar</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">Sasta <span>Bazaar</span></div>
    <div class="nav-links">
      <a href="index.html">Shop</a>
      <a href="orders.html">My Orders</a>
      <a href="wishlist.html">Wishlist</a>
    </div>
  </div>
</div>
<div class="container">
  <div class="hero" style="padding-bottom:10px;"><h1>Aapke Orders</h1></div>
  <div class="panel" id="ordersPanel">
    <table>
      <thead><tr><th>Order #</th><th>Total</th><th>Payment</th><th>Status</th><th>Date</th></tr></thead>
      <tbody id="ordersBody"></tbody>
    </table>
  </div>
</div>
<script>
const API = '/api';
async function load() {
  const userId = localStorage.getItem('bazaar_userId');
  const body = document.getElementById('ordersBody');
  if (!userId) { document.getElementById('ordersPanel').innerHTML = '<div class="empty">Orders dekhne ke liye login karein.</div>'; return; }
  const res = await fetch(`${API}/orders/buyer/${userId}`);
  const orders = await res.json();
  if (!Array.isArray(orders) || orders.length === 0) {
    document.getElementById('ordersPanel').innerHTML = '<div class="empty">Abhi tak koi order nahi.</div>';
    return;
  }
  body.innerHTML = orders.map(o => `
    <tr>
      <td>#${o.id}</td>
      <td>Rs ${o.total_amount}</td>
      <td>${o.payment_method} — ${o.payment_status}</td>
      <td><span class="status-badge status-${o.order_status}">${o.order_status}</span></td>
      <td>${new Date(o.created_at).toLocaleDateString()}</td>
    </tr>
  `).join('');
}
load();
</script>
</body>
</html>
